name: ontolab-local

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ontolab
      POSTGRES_USER: ontolab
      POSTGRES_PASSWORD: ontolab
    ports:
      - "127.0.0.1:${ONTOLAB_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontolab -d ontolab"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
